# Netlify: configurar "Base directory" = tienda
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# /api/create-order lo declara la propia función (config.path en netlify/functions/create-order.mts).

# SPA: todas las rutas sirven index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-cache"

# El service worker del panel siempre se revisa (así los cambios llegan enseguida).
[[headers]]
  for = "/admin-sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/admin"
