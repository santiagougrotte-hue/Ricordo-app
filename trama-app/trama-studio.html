<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRAMA Studio — Gestión financiera</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2317140f'/%3E%3Ctext x='50' y='68' font-family='Georgia,serif' font-size='58' font-weight='700' fill='%23e7ddc9' text-anchor='middle'%3ET%3C/text%3E%3C/svg%3E">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f7f4ee;--surface:#fffdfa;--surface2:#f1ece2;--surface3:#e8e0d2;
  --border:#e3dbcb;--border2:#d2c6ac;
  --accent:#a3603d;--accent2:#bd7a54;--accent-dim:rgba(163,96,61,.1);
  --green:#5c8267;--green-dim:rgba(92,130,103,.1);
  --red:#ac5449;--red-dim:rgba(172,84,73,.1);
  --blue:#5c7791;--blue-dim:rgba(92,119,145,.1);
  --orange:#b8863f;--orange-dim:rgba(184,134,63,.1);
  --purple:#8a7396;--purple-dim:rgba(138,115,150,.1);
  --text:#211d17;--text2:#6b6155;--text3:#a2977f;
  --sidebar:222px;--radius:10px;
}
html,body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;font-size:13px}
body{min-height:100vh;display:flex}
h1,h2,h3{font-family:Georgia,'Times New Roman',serif;font-weight:600}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
table{border-collapse:collapse;width:100%}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:12.5px}

/* ===== Sidebar ===== */
#sidebar{width:var(--sidebar);flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);
  position:fixed;top:0;left:0;bottom:0;overflow-y:auto;transition:width .2s ease;z-index:100;display:flex;flex-direction:column}
#sidebar.collapsed{width:56px}
#sidebar.collapsed .nav-label,#sidebar.collapsed .nav-group,#sidebar.collapsed .brand-sub{display:none}
#sidebar.collapsed .brand-name{font-size:14px}
#toggle-sidebar{position:absolute;top:10px;right:-14px;width:28px;height:28px;background:var(--surface);
  border:1px solid var(--border);border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:12px;z-index:101;color:var(--text2)}
.brand{padding:22px 18px 15px;border-bottom:1px solid var(--border)}
.brand-name{font-family:Georgia,serif;font-weight:600;font-size:18px;letter-spacing:.3px}
.brand-sub{font-size:10.5px;color:var(--text3);margin-top:2px}
.nav-group{margin-top:8px;padding:10px 12px 2px;font-size:10px;text-transform:uppercase;letter-spacing:2px;color:var(--text3)}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 14px;margin:1px 6px;border-radius:6px;cursor:pointer;
  color:var(--text2);font-size:12.5px;border-left:2px solid transparent;white-space:nowrap}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:var(--accent-dim);color:var(--accent);border-left-color:var(--accent);font-weight:500}
.nav-icon{width:16px;text-align:center;flex-shrink:0}

/* ===== Main / header ===== */
#main{margin-left:var(--sidebar);flex:1;min-width:0;transition:margin .2s ease}
#main.collapsed{margin-left:56px}
#header{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 28px;background:rgba(247,244,238,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
#header-title{font-size:13px;font-weight:500;color:var(--text2)}
.period-select{display:flex;gap:8px}
#content{padding:22px 28px}
.page{display:none}
.page.active{display:block}

/* ===== Components ===== */
.page-header{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:20px}
.page-title{font-size:22px}
.page-sub{font-size:12px;color:var(--text3);margin-top:3px}
.page-actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px}

.card{border-radius:var(--radius);border:1px solid var(--border);border-top:2px solid var(--border);background:var(--surface);padding:18px;margin-bottom:16px}
.card.accent{border-top-color:var(--accent)}
.card.green{border-top-color:var(--green)}
.card.red{border-top-color:var(--red)}
.card-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;color:var(--text3);
  margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.kpi{border-radius:var(--radius);border:1px solid var(--border);border-top:2px solid var(--border);background:var(--surface);padding:16px}
.kpi.c-accent{border-top-color:var(--accent)}.kpi.c-green{border-top-color:var(--green)}.kpi.c-red{border-top-color:var(--red)}
.kpi.c-blue{border-top-color:var(--blue)}.kpi.c-orange{border-top-color:var(--orange)}.kpi.c-purple{border-top-color:var(--purple)}
.kpi-label{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--text3)}
.kpi-value{font-family:Georgia,serif;font-size:22px;font-weight:600;margin:6px 0;line-height:1}
.kpi-value.c-accent{color:var(--accent)}.kpi-value.c-green{color:var(--green)}.kpi-value.c-red{color:var(--red)}
.kpi-value.c-blue{color:var(--blue)}.kpi-value.c-orange{color:var(--orange)}.kpi-value.c-purple{color:var(--purple)}
.kpi-sub{font-size:11px;color:var(--text3)}

.btn{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border-radius:6px;font-weight:500;font-size:12.5px;
  padding:8px 14px;border:1px solid transparent;background:var(--accent);color:#fffdfa;transition:background .15s}
.btn:hover{background:var(--accent2)}
.btn.ghost{background:transparent;color:var(--text2);border-color:var(--border)}
.btn.ghost:hover{background:var(--surface2);color:var(--text)}
.btn.danger{background:var(--red-dim);color:var(--red);border-color:rgba(172,84,73,.2)}
.btn.danger:hover{background:rgba(172,84,73,.2)}
.btn.sm{padding:5px 10px;font-size:11.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}

.badge{display:inline-flex;align-items:center;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:500;white-space:nowrap}
.badge.accent{background:var(--accent-dim);color:var(--accent)}
.badge.green{background:var(--green-dim);color:var(--green)}
.badge.red{background:var(--red-dim);color:var(--red)}
.badge.blue{background:var(--blue-dim);color:var(--blue)}
.badge.orange{background:var(--orange-dim);color:var(--orange)}
.badge.purple{background:var(--purple-dim);color:var(--purple)}

input[type=text],input[type=number],input[type=date],input[type=email],input[type=password],input:not([type]),select,textarea{
  width:100%;border-radius:6px;border:1px solid var(--border);background:var(--surface2);padding:8px 11px;font-size:12.5px;color:var(--text);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:2px}
.field label{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.4px;color:var(--text3)}
.field.full{grid-column:1/-1}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}

table{font-size:12.5px}
th{white-space:nowrap;border-bottom:1px solid var(--border);padding:9px 10px;text-align:left;font-size:10px;font-weight:600;
  text-transform:uppercase;letter-spacing:1.3px;color:var(--text3)}
td{border-bottom:1px solid rgba(227,219,203,.6);padding:9px 10px;vertical-align:middle;color:var(--text2)}
td.main{font-weight:500;color:var(--text)}
tr:hover td{background:rgba(241,236,226,.5)}
.table-wrap{overflow-x:auto}
a.link,.link{color:var(--text3);text-decoration:none;cursor:pointer}
a.link:hover,.link:hover{color:var(--accent)}

.filter-tabs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}
.ftab{cursor:pointer;border-radius:999px;border:1px solid var(--border);background:var(--surface2);color:var(--text3);
  padding:6px 14px;font-size:12px}
.ftab.active{border-color:rgba(163,96,61,.3);background:var(--accent-dim);color:var(--accent)}

.tabs{display:flex;gap:16px;border-bottom:1px solid var(--border);margin-bottom:16px}
.tab{cursor:pointer;border-bottom:2px solid transparent;padding-bottom:10px;font-size:12.5px;color:var(--text3)}
.tab.active{border-color:var(--accent);color:var(--text);font-weight:500}

.steps{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:22px}
.step-chip{display:flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-size:11px;font-weight:500;background:var(--surface2);color:var(--text3)}
.step-chip.current{background:var(--accent);color:#fffdfa}
.step-chip.done{background:var(--accent-dim);color:var(--accent)}
.step-sep{width:12px;height:1px;background:var(--border)}

.empty{padding:40px 0;text-align:center;color:var(--text3)}
.empty .ico{font-size:32px;margin-bottom:8px}

.bar-row{display:flex;align-items:center;gap:10px}
.bar-label{width:150px;flex-shrink:0;text-align:right;font-size:11.5px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{height:7px;flex:1;border-radius:4px;background:var(--surface3);overflow:hidden}
.bar-fill{height:100%;border-radius:4px;background:var(--accent)}
.bar-fill.green{background:var(--green)}.bar-fill.red{background:var(--red)}.bar-fill.blue{background:var(--blue)}.bar-fill.orange{background:var(--orange)}
.bar-val{width:96px;flex-shrink:0;text-align:right;font-size:11.5px;color:var(--text2)}

.alert{display:flex;align-items:center;gap:8px;border-radius:8px;border:1px solid;padding:10px 14px;font-size:12.5px;margin-bottom:10px}
.alert.warning{background:var(--orange-dim);border-color:rgba(184,134,63,.2);color:var(--orange)}
.alert.success{background:var(--green-dim);border-color:rgba(92,130,103,.2);color:var(--green)}
.alert.info{background:var(--blue-dim);border-color:rgba(92,119,145,.2);color:var(--blue)}
.alert.danger{background:var(--red-dim);border-color:rgba(172,84,73,.2);color:var(--red)}

.pill{cursor:pointer;border-radius:999px;border:1px solid var(--border);background:var(--surface2);color:var(--text3);
  padding:4px 12px;font-size:11px;display:inline-block}
.pill.on{border-color:rgba(163,96,61,.3);background:var(--accent-dim);color:var(--accent)}
.yesno{display:inline-flex;gap:6px}
.yesno button{border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--text3);padding:6px 12px;font-size:12px}
.yesno button.on{border-color:rgba(163,96,61,.3);background:var(--accent-dim);color:var(--accent)}

/* Modal */
#modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;padding:20px;z-index:1000}
#modal-overlay.open{display:flex}
#modal-box{width:100%;max-width:640px;max-height:90vh;overflow-y:auto;background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:24px;box-shadow:0 10px 40px rgba(0,0,0,.15)}
#modal-box.wide{max-width:900px}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.modal-head h3{font-size:17px}
.modal-close{background:none;border:none;font-size:22px;line-height:1;color:var(--text3)}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--border);margin-top:18px;padding-top:14px}

/* Toast */
#toast-container{position:fixed;bottom:16px;right:16px;z-index:2000;display:flex;flex-direction:column;gap:8px}
.toast{border-radius:8px;border:1px solid;padding:11px 16px;font-size:12.5px;font-weight:500;box-shadow:0 6px 20px rgba(0,0,0,.08)}
.toast.success{background:var(--green-dim);border-color:rgba(92,130,103,.3);color:var(--green)}
.toast.error{background:var(--red-dim);border-color:rgba(172,84,73,.3);color:var(--red)}
.toast.info{background:var(--blue-dim);border-color:rgba(92,119,145,.3);color:var(--blue)}

#mobile-menu-btn{display:none}
@media(max-width:860px){
  #sidebar{transform:translateX(-100%)}
  #sidebar.mobile-open{transform:translateX(0)}
  #main,#main.collapsed{margin-left:0}
  #toggle-sidebar{display:none}
  #mobile-menu-btn{display:flex}
  #content{padding:16px}
}
@media print{ .no-print{display:none!important} }
</style>
</head>
<body>

<nav id="sidebar">
  <button id="toggle-sidebar" onclick="toggleSidebar()">◀</button>
  <div class="brand">
    <div class="brand-name">TRAMA Studio</div>
    <div class="brand-sub">Gestión financiera</div>
  </div>
  <div id="nav-items" style="flex:1;padding-bottom:8px"></div>
</nav>

<div id="main">
  <div id="header">
    <div style="display:flex;align-items:center;gap:10px">
      <button id="mobile-menu-btn" class="btn ghost sm" onclick="document.getElementById('sidebar').classList.toggle('mobile-open')">☰</button>
      <div id="header-title"></div>
    </div>
    <div class="period-select" id="period-select"></div>
  </div>
  <div id="content">
    <div class="page" id="page-dashboard"></div>
    <div class="page" id="page-clientes"></div>
    <div class="page" id="page-presupuestos"></div>
    <div class="page" id="page-servicios"></div>
    <div class="page" id="page-equipo"></div>
    <div class="page" id="page-finanzas"></div>
    <div class="page" id="page-reportes"></div>
    <div class="page" id="page-configuracion"></div>
  </div>
</div>

<div id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div id="modal-box">
    <div class="modal-head"><h3 id="modal-title"></h3><button class="modal-close" onclick="closeModal()">×</button></div>
    <div id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<div id="toast-container"></div>

<script>
/* ════════════════════════════════════════════════
   ESTADO Y PERSISTENCIA
   ════════════════════════════════════════════════ */
const SK = 'trama_app_data';

function defaultConfig(){
  return {
    nombreEstudio:'TRAMA Studio', nombreDirectora:'', monedaPrincipal:'ARS', tipoCambioDefault:1000,
    porcentajeImpuestos:10, comisionesPct:3, margenGananciaMinimo:20, margenGananciaSugerido:35, margenGananciaPremium:50,
    fondoImprevistos:8, porcentajeReinversion:15, sueldoObjetivoDirectora:0,
    modalidadSueldoDirectora:'fijo', sueldoFijoDirectora:0, porcentajeSueldoDirectora:15,
    categoriasGastos:['Producción','Sueldos','Freelance','Suscripciones','Alquiler','Transporte','Publicidad','Equipamiento','Software','Impuestos','Viáticos','Otros'],
    datosBancarios:'', datosFiscales:''
  };
}
function emptyData(){
  return { clientes:[], servicios:[], equipo:[], presupuestos:[], movimientos:[], config:defaultConfig() };
}
function loadDB(){
  try{ const raw = localStorage.getItem(SK); if(raw) return Object.assign(emptyData(), JSON.parse(raw)); }catch(e){}
  return emptyData();
}
let DB = loadDB();
function save(){ localStorage.setItem(SK, JSON.stringify(DB)); }

let uidCounter = 0;
function uid(prefix){ uidCounter++; return prefix+'-'+Date.now().toString(36)+uidCounter.toString(36); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
const $ = id => document.getElementById(id);
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ════════════════════════════════════════════════
   CATÁLOGOS / CONSTANTES
   ════════════════════════════════════════════════ */
const ESTADOS_CLIENTE = [
  {value:'potencial',label:'Potencial'},{value:'presupuesto_enviado',label:'Presupuesto enviado'},
  {value:'negociacion',label:'Negociación'},{value:'activo',label:'Activo'},
  {value:'pausado',label:'Pausado'},{value:'finalizado',label:'Finalizado'}
];
const ESTADO_CLIENTE_COLOR = {potencial:'blue',presupuesto_enviado:'purple',negociacion:'orange',activo:'green',pausado:'orange',finalizado:'red'};
const UNIDADES_COBRO = [
  {value:'hora',label:'Por hora'},{value:'pieza',label:'Por pieza'},{value:'jornada',label:'Por jornada'},
  {value:'proyecto',label:'Por proyecto'},{value:'mes',label:'Por mes'}
];
const NIVELES_COMPLEJIDAD = [{value:'baja',label:'Baja'},{value:'media',label:'Media'},{value:'alta',label:'Alta'}];
const COMPLEJIDAD_COLOR = {baja:'green',media:'orange',alta:'red'};
const TIPOS_CONTRATACION = [
  {value:'mensual',label:'Mensual'},{value:'hora',label:'Por hora'},{value:'jornada',label:'Por jornada'},
  {value:'pieza',label:'Por pieza'},{value:'cliente',label:'Por cliente'},{value:'proyecto',label:'Por proyecto'}
];
const CATEGORIAS_COSTO_ADICIONAL = ['Traslados','Viáticos','Equipamiento','Alquiler de locación','Utilería','Modelos','Maquillaje y peinado','Honorarios freelance','Gestión del proyecto','Coordinación y administración','Otros'];
const CATEGORIAS_DISTRIBUCION_SUGERIDAS = ['Pago de diseñadora gráfica','Pago de productora','Pago de creadora de contenido','Pago de community manager','Pago de fotógrafa','Pago de editora','Pago de estilista','Pago de otros colaboradores','Costos de producción','Gastos operativos','Impuestos','Mi sueldo como directora','Ganancia de TRAMA','Reinversión','Fondo de emergencia'];
const ESTADOS_PRESUPUESTO = [
  {value:'borrador',label:'Borrador'},{value:'revision',label:'En revisión'},{value:'enviado',label:'Enviado'},
  {value:'visto',label:'Visto por el cliente'},{value:'negociacion',label:'En negociación'},
  {value:'aprobado',label:'Aprobado'},{value:'rechazado',label:'Rechazado'},{value:'vencido',label:'Vencido'}
];
const ESTADO_PRESUPUESTO_COLOR = {borrador:'blue',revision:'purple',enviado:'blue',visto:'purple',negociacion:'orange',aprobado:'green',rechazado:'red',vencido:'red'};
const MODALIDADES_SUELDO_DIRECTORA = [
  {value:'fijo',label:'Sueldo fijo mensual'},{value:'porcentaje_facturacion',label:'Porcentaje de la facturación'},
  {value:'porcentaje_ganancia',label:'Porcentaje de la ganancia'},{value:'fijo_mas_porcentaje',label:'Sueldo fijo más porcentaje'},
  {value:'por_proyecto',label:'Pago por dirección de cada proyecto'},{value:'retiros',label:'Retiros personales'}
];
const TIPOS_MOVIMIENTO = [
  {value:'ingreso_cliente',label:'Ingreso de cliente',ingreso:true},{value:'adelanto',label:'Adelanto',ingreso:true},
  {value:'saldo_pendiente',label:'Saldo pendiente',ingreso:true},{value:'gasto_produccion',label:'Gasto de producción',ingreso:false},
  {value:'pago_sueldo',label:'Pago de sueldo',ingreso:false},{value:'pago_freelance',label:'Pago freelance',ingreso:false},
  {value:'suscripcion',label:'Suscripción',ingreso:false},{value:'alquiler',label:'Alquiler',ingreso:false},
  {value:'transporte',label:'Transporte',ingreso:false},{value:'publicidad',label:'Publicidad',ingreso:false},
  {value:'equipamiento',label:'Equipamiento',ingreso:false},{value:'software',label:'Software',ingreso:false},
  {value:'impuestos',label:'Impuestos',ingreso:false},{value:'viaticos',label:'Viáticos',ingreso:false},
  {value:'otros_gastos',label:'Otros gastos',ingreso:false}
];
function esIngreso(tipo){ const t=TIPOS_MOVIMIENTO.find(x=>x.value===tipo); return t?t.ingreso:false; }
const TIPOS_SUELDO = ['pago_sueldo','pago_freelance'];

const NAV = [
  {group:'',items:[{key:'dashboard',label:'Inicio',icon:'◆'}]},
  {group:'Comercial',items:[{key:'clientes',label:'Clientes',icon:'◐'},{key:'presupuestos',label:'Presupuestos',icon:'▤'}]},
  {group:'Estudio',items:[{key:'servicios',label:'Servicios',icon:'✦'},{key:'equipo',label:'Equipo',icon:'◎'}]},
  {group:'Finanzas',items:[{key:'finanzas',label:'Finanzas',icon:'▥'},{key:'reportes',label:'Reportes',icon:'▲'}]},
  {group:'',items:[{key:'configuracion',label:'Configuración',icon:'⚙'}]}
];
const NAV_LABELS = {}; NAV.forEach(g=>g.items.forEach(i=>NAV_LABELS[i.key]=i.label));

/* ════════════════════════════════════════════════
   FORMATO / FECHAS
   ════════════════════════════════════════════════ */
function fMoney(n, moneda){ moneda=moneda||'ARS'; n=Number(n)||0; return n.toLocaleString('es-AR',{style:'currency',currency:moneda,maximumFractionDigits:0}); }
function fNum(n,d){ d=d||0; n=Number(n)||0; return n.toLocaleString('es-AR',{minimumFractionDigits:d,maximumFractionDigits:d}); }
function fPct(n,d){ d=d==null?0:d; n=Number(n)||0; return fNum(n,d)+'%'; }
function pctDe(monto,total){ return total>0 ? (monto/total)*100 : 0; }
function inPeriod(fecha,mes,anio){ if(!fecha) return false; const p=fecha.split('-'); return Number(p[1])===mes && Number(p[0])===anio; }
function mesAnterior(mes,anio){ return mes===1 ? {mes:12,anio:anio-1} : {mes:mes-1,anio}; }
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

/* ════════════════════════════════════════════════
   MONEDA / MOVIMIENTOS
   ════════════════════════════════════════════════ */
function montoEnARS(monto,moneda,tc){ return moneda==='USD' ? monto*(tc||1) : monto; }
function movARS(m){ return montoEnARS(m.monto,m.moneda,m.tipoCambio); }

function movimientosDelMes(mes,anio){ return DB.movimientos.filter(m=>inPeriod(m.fecha,mes,anio)); }
function facturacionMes(mes,anio){ return movimientosDelMes(mes,anio).filter(m=>esIngreso(m.tipo)).reduce((a,m)=>a+movARS(m),0); }
function cobradoMes(mes,anio){ return movimientosDelMes(mes,anio).filter(m=>esIngreso(m.tipo)&&m.estado==='cobrado').reduce((a,m)=>a+movARS(m),0); }
function pendienteCobroMes(mes,anio){ return movimientosDelMes(mes,anio).filter(m=>esIngreso(m.tipo)&&m.estado!=='cobrado').reduce((a,m)=>a+movARS(m),0); }
function gastosMes(mes,anio){ return movimientosDelMes(mes,anio).filter(m=>!esIngreso(m.tipo)&&!TIPOS_SUELDO.includes(m.tipo)).reduce((a,m)=>a+movARS(m),0); }
function sueldosMes(mes,anio){ return movimientosDelMes(mes,anio).filter(m=>TIPOS_SUELDO.includes(m.tipo)).reduce((a,m)=>a+movARS(m),0); }
function sueldoDirectoraMes(mes,anio){
  const ids = new Set(DB.equipo.filter(p=>p.esDirectora).map(p=>p.id));
  return movimientosDelMes(mes,anio).filter(m=>m.tipo==='pago_sueldo'&&m.personaId&&ids.has(m.personaId)).reduce((a,m)=>a+movARS(m),0);
}
function resumenMes(mes,anio){
  const facturacion=facturacionMes(mes,anio), cobrado=cobradoMes(mes,anio), pendienteCobro=pendienteCobroMes(mes,anio);
  const gastos=gastosMes(mes,anio), sueldos=sueldosMes(mes,anio), sueldoDirectora=sueldoDirectoraMes(mes,anio);
  const gananciaBruta=cobrado-gastos, gananciaNeta=gananciaBruta-sueldos;
  const margenGanancia = cobrado>0 ? (gananciaNeta/cobrado)*100 : 0;
  const reinversionDisponible = gananciaNeta>0 ? gananciaNeta*(DB.config.porcentajeReinversion/100) : 0;
  return {facturacion,cobrado,pendienteCobro,gastos,sueldos,sueldoDirectora,gananciaBruta,gananciaNeta,margenGanancia,reinversionDisponible};
}
function gastosPorCategoria(mes,anio){
  const map=new Map();
  movimientosDelMes(mes,anio).forEach(m=>{ if(esIngreso(m.tipo)) return; const k=m.categoria||'Sin categoría'; map.set(k,(map.get(k)||0)+movARS(m)); });
  return Array.from(map.entries()).map(([categoria,monto])=>({categoria,monto})).sort((a,b)=>b.monto-a.monto);
}
function evolucionFacturacion(n){
  n=n||6; const now=new Date(); const out=[];
  for(let i=n-1;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    const mes=d.getMonth()+1, anio=d.getFullYear(); const r=resumenMes(mes,anio);
    out.push({label:d.toLocaleDateString('es-AR',{month:'short'}),mes,anio,facturacion:r.facturacion,gastos:r.gastos,gananciaNeta:r.gananciaNeta});
  }
  return out;
}
function movimientosCliente(clienteId,mes,anio){
  return DB.movimientos.filter(m=>m.clienteId===clienteId && (mes==null||inPeriod(m.fecha,mes,anio)));
}
function rentabilidadCliente(cliente,mes,anio){
  const movs=movimientosCliente(cliente.id,mes,anio);
  const ingresos=movs.filter(m=>esIngreso(m.tipo)).reduce((a,m)=>a+movARS(m),0);
  const gastos=movs.filter(m=>!esIngreso(m.tipo)).reduce((a,m)=>a+movARS(m),0);
  const ganancia=ingresos-gastos; const margen = ingresos>0 ? (ganancia/ingresos)*100 : 0;
  return {cliente,ingresos,gastos,ganancia,margen};
}
function rentabilidadPorCliente(mes,anio){
  return DB.clientes.map(c=>rentabilidadCliente(c,mes,anio)).filter(r=>r.ingresos>0||r.gastos>0).sort((a,b)=>b.ganancia-a.ganancia);
}
function pagosPendientesPersona(personaId){
  return DB.movimientos.filter(m=>m.personaId===personaId&&TIPOS_SUELDO.includes(m.tipo)&&m.estado==='pendiente').reduce((a,m)=>a+movARS(m),0);
}
function pagosRealizadosPersona(personaId,mes,anio){
  return DB.movimientos.filter(m=>m.personaId===personaId&&TIPOS_SUELDO.includes(m.tipo)&&m.estado==='pagado'&&inPeriod(m.fecha,mes,anio)).reduce((a,m)=>a+movARS(m),0);
}
function estimacionCobroPersona(p){
  if(p.tipoContratacion==='mensual') return p.sueldoFijo;
  if(p.tipoContratacion==='cliente') return p.clientesAsignados.length*p.valorPieza;
  return 0;
}
function calcularPuntoEquilibrio(){
  const now=new Date(); let totalGastos=0, totalSueldos=0;
  for(let i=0;i<3;i++){ const d=new Date(now.getFullYear(),now.getMonth()-i,1); totalGastos+=gastosMes(d.getMonth()+1,d.getFullYear()); totalSueldos+=sueldosMes(d.getMonth()+1,d.getFullYear()); }
  const sueldosFijosEquipo = DB.equipo.filter(p=>p.activa&&p.tipoContratacion==='mensual').reduce((a,p)=>a+p.sueldoFijo,0);
  const costosFijosMensuales = totalGastos/3 + Math.max(totalSueldos/3, sueldosFijosEquipo);
  return {costosFijosMensuales, facturacionNecesariaCubrirCostos:costosFijosMensuales, facturacionParaGanancia:(o)=>costosFijosMensuales+o};
}
function calcularAlertas(){
  const alertas=[]; const now=new Date(); const mes=now.getMonth()+1, anio=now.getFullYear();
  DB.presupuestos.forEach(p=>{
    if(p.estado==='aprobado'||p.estado==='borrador'){
      const t=calcularPresupuesto(p);
      if(t.margenReal < DB.config.margenGananciaMinimo) alertas.push({kind:'danger',texto:'Presupuesto #'+p.numero+' ('+esc(p.nombreCliente)+') tiene un margen de '+fPct(t.margenReal)+', por debajo del mínimo ('+fPct(DB.config.margenGananciaMinimo)+').'});
    }
  });
  DB.movimientos.forEach(m=>{
    if(m.estado==='pendiente'){ const f=new Date(m.fecha+'T00:00:00'); if(f<now) alertas.push({kind:'warning',texto:(esIngreso(m.tipo)?'Cobro':'Pago')+' pendiente vencido: "'+esc(m.descripcion)+'" ('+fMoney(movARS(m))+').'}); }
  });
  rentabilidadPorCliente(mes,anio).forEach(r=>{ if(r.ganancia<0) alertas.push({kind:'danger',texto:esc(r.cliente.marca)+' no es rentable este mes ('+fMoney(r.ganancia)+').'}); });
  const resumen=resumenMes(mes,anio);
  if(resumen.sueldos+resumen.gastos>resumen.cobrado && resumen.cobrado>0) alertas.push({kind:'danger',texto:'Los sueldos y gastos fijos superan lo cobrado este mes.'});
  DB.servicios.forEach(s=>{ if(s.precioBase>0&&s.costoInterno>0&&s.precioBase<s.costoInterno) alertas.push({kind:'warning',texto:'El servicio "'+esc(s.nombre)+'" se está cobrando por debajo de su costo interno.'}); });
  return alertas;
}

/* ════════════════════════════════════════════════
   PRESUPUESTOS — PRICING
   ════════════════════════════════════════════════ */
function precioParaMargen(costo,margenPct,imp,com){ const d=(margenPct+imp+com)/100; if(d>=0.98) return costo*5; return costo/(1-d); }
function calcularPresupuesto(p){
  const costoItems = p.items.reduce((a,it)=>a+it.costoUnitario*it.cantidad,0);
  const subtotalCliente = p.items.reduce((a,it)=>a+it.precioUnitario*it.cantidad,0);
  const costoAdicionales = p.costosAdicionales.reduce((a,c)=>a+c.monto,0);
  const baseCostos = costoItems+costoAdicionales;
  const fondoImprevistosMonto = baseCostos*(p.fondoImprevistosPct/100);
  const costoInterno = baseCostos+fondoImprevistosMonto;
  const precioMinimo=precioParaMargen(costoInterno,p.margenMinimoPct,p.impuestosPct,p.comisionesPct);
  const precioSugerido=precioParaMargen(costoInterno,p.margenSugeridoPct,p.impuestosPct,p.comisionesPct);
  const precioPremium=precioParaMargen(costoInterno,p.margenPremiumPct,p.impuestosPct,p.comisionesPct);
  const precioFinal = p.precioElegido==='minimo'?precioMinimo:p.precioElegido==='premium'?precioPremium:p.precioElegido==='manual'?p.precioManual:precioSugerido;
  const impuestosMonto=precioFinal*(p.impuestosPct/100), comisionesMonto=precioFinal*(p.comisionesPct/100);
  const gananciaTrama=precioFinal-costoInterno-impuestosMonto-comisionesMonto;
  const margenReal = precioFinal>0 ? (gananciaTrama/precioFinal)*100 : 0;
  return {costoItems,costoAdicionales,baseCostos,fondoImprevistosMonto,costoInterno,precioMinimo,precioSugerido,precioPremium,precioFinal,impuestosMonto,comisionesMonto,gananciaTrama,margenReal,subtotalCliente};
}
function montoDistribucion(item,precioFinal){ return item.tipo==='fijo' ? item.valor : precioFinal*(item.valor/100); }
function resumenDistribucion(p,precioFinal){
  const totalDistribuido=p.distribucion.reduce((a,d)=>a+montoDistribucion(d,precioFinal),0);
  const diferencia=precioFinal-totalDistribuido;
  return {totalDistribuido,totalPresupuesto:precioFinal,diferencia,excede:diferencia<-0.5,incompleto:diferencia>0.5};
}
function siguienteNumeroPresupuesto(){ return DB.presupuestos.reduce((m,p)=>Math.max(m,p.numero),0)+1; }
function desgloseCostosPorResponsable(p){
  const map=new Map();
  p.items.forEach(it=>{ const s = it.servicioId ? DB.servicios.find(sv=>sv.id===it.servicioId) : null; const k=(s&&s.profesionalResponsable)||'Sin asignar'; map.set(k,(map.get(k)||0)+it.costoUnitario*it.cantidad); });
  return Array.from(map.entries()).map(([responsable,monto])=>({responsable,monto})).sort((a,b)=>b.monto-a.monto);
}

/* ════════════════════════════════════════════════
   UI: TOAST / MODAL
   ════════════════════════════════════════════════ */
function toast(msg,kind){
  kind=kind||'success';
  const el=document.createElement('div'); el.className='toast '+kind; el.textContent=msg;
  $('toast-container').appendChild(el); setTimeout(()=>el.remove(),3000);
}
function openModal(title,bodyHtml,footerHtml,wide){
  $('modal-title').textContent=title; $('modal-body').innerHTML=bodyHtml; $('modal-footer').innerHTML=footerHtml||'';
  $('modal-box').className = wide ? 'wide' : '';
  $('modal-overlay').classList.add('open');
}
function closeModal(){ $('modal-overlay').classList.remove('open'); }

/* ════════════════════════════════════════════════
   NAVEGACIÓN
   ════════════════════════════════════════════════ */
let currentPage='dashboard';
let sidebarCollapsed=false;
const now0=new Date();
let period={mes:now0.getMonth()+1,anio:now0.getFullYear()};
const PERIOD_PAGES=new Set(['dashboard','finanzas','reportes']);

function toggleSidebar(){
  sidebarCollapsed=!sidebarCollapsed;
  $('sidebar').classList.toggle('collapsed',sidebarCollapsed);
  $('main').classList.toggle('collapsed',sidebarCollapsed);
  $('toggle-sidebar').textContent = sidebarCollapsed ? '▶' : '◀';
}
function renderNav(){
  let html='';
  NAV.forEach(g=>{
    if(g.group) html+='<div class="nav-group">'+esc(g.group)+'</div>';
    g.items.forEach(it=>{
      html+='<div class="nav-item'+(currentPage===it.key?' active':'')+'" onclick="go(\''+it.key+'\')"><span class="nav-icon">'+it.icon+'</span><span class="nav-label">'+esc(it.label)+'</span></div>';
    });
  });
  $('nav-items').innerHTML=html;
}
function renderPeriodSelect(){
  if(!PERIOD_PAGES.has(currentPage)){ $('period-select').innerHTML=''; return; }
  const years=[]; for(let i=0;i<6;i++) years.push(now0.getFullYear()-4+i);
  let html='<select onchange="period.mes=Number(this.value);renderPage()">';
  MESES.forEach((m,i)=>html+='<option value="'+(i+1)+'"'+(period.mes===i+1?' selected':'')+'>'+m+'</option>');
  html+='</select><select onchange="period.anio=Number(this.value);renderPage()">';
  years.forEach(y=>html+='<option value="'+y+'"'+(period.anio===y?' selected':'')+'>'+y+'</option>');
  html+='</select>';
  $('period-select').innerHTML=html;
}
function go(page){
  currentPage=page;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  $('page-'+page).classList.add('active');
  $('header-title').textContent = NAV_LABELS[page]||'';
  $('sidebar').classList.remove('mobile-open');
  renderNav(); renderPeriodSelect(); renderPage();
}
function renderPage(){
  ({dashboard:renderDashboard,clientes:renderClientes,presupuestos:renderPresupuestos,servicios:renderServicios,
    equipo:renderEquipo,finanzas:renderFinanzas,reportes:renderReportes,configuracion:renderConfiguracion}[currentPage]||function(){})();
}
</script>
<script>
/* ════════════════════════════════════════════════
   DASHBOARD
   ════════════════════════════════════════════════ */
function renderDashboard(){
  const mes=period.mes, anio=period.anio;
  const r=resumenMes(mes,anio); const prev=mesAnterior(mes,anio); const rPrev=resumenMes(prev.mes,prev.anio);
  const clientesActivos=DB.clientes.filter(c=>c.estado==='activo').length;
  const presEnviados=DB.presupuestos.filter(p=>['enviado','visto','negociacion'].includes(p.estado)).length;
  const presAprobados=DB.presupuestos.filter(p=>p.estado==='aprobado').length;
  const presPendientes=DB.presupuestos.filter(p=>['borrador','revision','enviado','visto','negociacion'].includes(p.estado)).length;
  const alertas=calcularAlertas().slice(0,3);
  const trend=evolucionFacturacion(6);
  const porCategoria=gastosPorCategoria(mes,anio).slice(0,6);
  const maxCategoria=Math.max(1,...porCategoria.map(c=>c.monto));
  const rentabilidad=rentabilidadPorCliente(mes,anio).slice(0,5);
  const maxRent=Math.max(1,...rentabilidad.map(x=>Math.abs(x.ganancia)));
  const vencimientos=DB.movimientos.filter(m=>m.estado==='pendiente').sort((a,b)=>a.fecha.localeCompare(b.fecha)).slice(0,6);

  function delta(a,p){ if(p===0) return '<span>vs. mes anterior: sin datos</span>'; const d=((a-p)/Math.abs(p))*100; const up=d>=0; return '<span style="color:'+(up?'var(--green)':'var(--red)')+'">'+(up?'▲':'▼')+' '+fPct(Math.abs(d))+' vs. mes anterior</span>'; }

  const maxTrend=Math.max(1,...trend.flatMap(d=>[d.facturacion,d.gastos,Math.abs(d.gananciaNeta)]));
  let trendHtml='<div style="display:flex;align-items:flex-end;justify-content:space-between;gap:8px;padding:8px 4px 0;height:160px">';
  trend.forEach(d=>{
    trendHtml+='<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px">'+
      '<div style="height:120px;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:3px">'+
      '<div style="width:8px;border-radius:2px 2px 0 0;background:var(--blue);height:'+Math.max(2,(d.facturacion/maxTrend)*120)+'px" title="Facturación: '+fMoney(d.facturacion)+'"></div>'+
      '<div style="width:8px;border-radius:2px 2px 0 0;background:var(--orange);height:'+Math.max(2,(d.gastos/maxTrend)*120)+'px" title="Gastos: '+fMoney(d.gastos)+'"></div>'+
      '<div style="width:8px;border-radius:2px 2px 0 0;background:'+(d.gananciaNeta>=0?'var(--green)':'var(--red)')+';height:'+Math.max(2,(Math.abs(d.gananciaNeta)/maxTrend)*120)+'px" title="Ganancia neta: '+fMoney(d.gananciaNeta)+'"></div>'+
      '</div><div style="font-size:10px;color:var(--text3);text-transform:capitalize">'+d.label+'</div></div>';
  });
  trendHtml+='</div><div style="margin-top:8px;display:flex;justify-content:center;gap:16px;font-size:10.5px;color:var(--text3)">'+
    '<span>■ Facturación</span><span>■ Gastos</span><span>■ Ganancia neta</span></div>';

  $('page-dashboard').innerHTML =
    '<div class="page-header"><div><h2 class="page-title">Inicio</h2><p class="page-sub">'+MESES[mes-1]+' '+anio+' · Panorama general de TRAMA Studio</p></div></div>'+
    alertas.map(a=>'<div class="alert '+a.kind+'">'+a.texto+'</div>').join('')+
    '<div class="stat-grid">'+
      kpi('Facturación del mes',fMoney(r.facturacion),'blue',delta(r.facturacion,rPrev.facturacion))+
      kpi('Cobrado',fMoney(r.cobrado),'green')+
      kpi('Pendiente de cobro',fMoney(r.pendienteCobro),'orange')+
      kpi('Gastos totales',fMoney(r.gastos),'orange')+
      kpi('Sueldos y colaboradoras',fMoney(r.sueldos),'purple')+
      kpi('Ganancia bruta',fMoney(r.gananciaBruta),r.gananciaBruta>=0?'green':'red')+
      kpi('Ganancia neta',fMoney(r.gananciaNeta),r.gananciaNeta>=0?'green':'red')+
      kpi('Margen de ganancia',fPct(r.margenGanancia,1),r.margenGanancia>=0?'green':'red')+
      kpi('Mi sueldo (directora)',fMoney(r.sueldoDirectora),'accent')+
      kpi('Disponible p/ reinversión',fMoney(r.reinversionDisponible),'accent')+
      kpi('Clientes activos',clientesActivos,'')+
      kpi('Presupuestos enviados',presEnviados,'blue')+
      kpi('Presupuestos aprobados',presAprobados,'green')+
      kpi('Presupuestos pendientes',presPendientes,'orange')+
    '</div>'+
    '<div style="display:grid;grid-template-columns:1fr;gap:16px" class="dash-grid">'+
      '<div class="card"><div class="card-title">Evolución de la facturación (6 meses)</div>'+trendHtml+'</div>'+
      '<div class="card"><div class="card-title">Próximos vencimientos<button class="btn ghost sm" onclick="go(\'finanzas\')">Ver finanzas</button></div>'+
        (vencimientos.length===0 ? emptyState('✓','No hay pagos ni cobros pendientes.') :
          vencimientos.map(m=>'<div style="display:flex;justify-content:space-between;gap:8px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);padding:8px 12px;margin-bottom:6px"><div><div style="font-size:12.5px;font-weight:500">'+esc(m.descripcion)+'</div><div style="font-size:10.5px;color:var(--text3)">'+m.fecha+'</div></div><div style="font-size:12.5px;font-weight:500;color:var(--text2)">'+fMoney(movARS(m))+'</div></div>').join('')
        )+'</div>'+
      '<div class="card"><div class="card-title">Gastos por categoría (mes)</div>'+
        (porCategoria.length===0 ? emptyState('','Sin gastos registrados este mes.') :
          porCategoria.map(c=>barRow(c.categoria,fMoney(c.monto),(c.monto/maxCategoria)*100,'orange')).join(''))+'</div>'+
      '<div class="card"><div class="card-title">Rentabilidad por cliente (mes)<button class="btn ghost sm" onclick="go(\'reportes\')">Ver reportes</button></div>'+
        (rentabilidad.length===0 ? emptyState('','Sin movimientos suficientes.') :
          rentabilidad.map(rr=>barRow(rr.cliente.marca,fMoney(rr.ganancia),(Math.abs(rr.ganancia)/maxRent)*100,rr.ganancia>=0?'green':'red')).join(''))+'</div>'+
    '</div>'+
    '<div style="margin-top:16px;display:flex;flex-wrap:wrap;gap:6px">'+
      ESTADOS_PRESUPUESTO.map(e=>'<span class="badge accent">'+e.label+': '+DB.presupuestos.filter(p=>p.estado===e.value).length+'</span>').join('')+
    '</div>';
}
function kpi(label,value,color,sub){
  return '<div class="kpi'+(color?' c-'+color:'')+'"><div class="kpi-label">'+esc(label)+'</div><div class="kpi-value'+(color?' c-'+color:'')+'">'+value+'</div>'+(sub?'<div class="kpi-sub">'+sub+'</div>':'')+'</div>';
}
function emptyState(icon,text){ return '<div class="empty">'+(icon?'<div class="ico">'+icon+'</div>':'')+'<div>'+esc(text)+'</div></div>'; }
function barRow(label,value,pct,color){
  return '<div class="bar-row" style="margin-bottom:8px"><div class="bar-label">'+esc(label)+'</div><div class="bar-track"><div class="bar-fill '+(color||'')+'" style="width:'+Math.max(0,Math.min(100,pct))+'%"></div></div><div class="bar-val">'+value+'</div></div>';
}
</script>
<script>
/* ════════════════════════════════════════════════
   CLIENTES
   ════════════════════════════════════════════════ */
let clienteFiltro='todos', clienteBusqueda='';
function renderClientes(){
  const lista = DB.clientes.filter(c=>clienteFiltro==='todos'||c.estado===clienteFiltro)
    .filter(c=>{ const q=clienteBusqueda.trim().toLowerCase(); if(!q) return true; return (c.marca||'').toLowerCase().includes(q)||(c.contacto||'').toLowerCase().includes(q)||(c.rubro||'').toLowerCase().includes(q); })
    .sort((a,b)=>a.marca.localeCompare(b.marca));

  $('page-clientes').innerHTML =
    '<div class="page-header"><div><h2 class="page-title">Clientes</h2><p class="page-sub">Marcas activas y potenciales</p></div>'+
    '<div class="page-actions"><button class="btn" onclick="abrirFormCliente()">+ Nuevo cliente</button></div></div>'+
    '<div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center">'+
      '<div class="filter-tabs">'+
        '<div class="ftab'+(clienteFiltro==='todos'?' active':'')+'" onclick="clienteFiltro=\'todos\';renderClientes()">Todos</div>'+

function toggleArr(arr,val,el){ const i=arr.indexOf(val); if(i>-1) arr.splice(i,1); else arr.push(val); el.classList.toggle('on'); }
function input(id,val,ph){ return '<input id="'+id+'" value="'+esc(val||'')+'"'+(ph?' placeholder="'+esc(ph)+'"':'')+'>'; }
function field(label,html,full){ return '<div class="field'+(full?' full':'')+'"><label>'+esc(label)+'</label>'+html+'</div>'; }
function selectHtml(id,options,val){ return '<select id="'+id+'">'+options.map(o=>'<option value="'+o.value+'"'+(o.value===val?' selected':'')+'>'+esc(o.label)+'</option>').join('')+'</select>'; }
function guardarCliente(editId){
  const f=window._formCliente;
  const marca=$('f-marca').value.trim();
  if(!marca){ toast('Ingresá el nombre de la marca.','error'); return; }
  const payload = {
    id: editId||uid('cli'), marca, contacto:$('f-contacto').value, telefono:$('f-telefono').value, email:$('f-email').value,

  };

}
function eliminarCliente(id){ DB.clientes=DB.clientes.filter(c=>c.id!==id); save(); toast('Cliente eliminado.','info'); closeModal(); renderClientes(); }

let clienteDetalleTab='resumen';

function renderClienteDetalle(id){
  const c=DB.clientes.find(x=>x.id===id); if(!c) return;
  const presupuestosCliente=DB.presupuestos.filter(p=>p.clienteId===c.id);
  const pagosCliente=DB.movimientos.filter(m=>m.clienteId===c.id).sort((a,b)=>b.fecha.localeCompare(a.fecha));
  const rent=rentabilidadCliente(c);
  const tabs=[['resumen','Resumen'],['presupuestos','Presupuestos'],['pagos','Pagos'],['rentabilidad','Rentabilidad']];
  let tabsHtml='<div class="tabs">'+tabs.map(t=>'<div class="tab'+(clienteDetalleTab===t[0]?' active':'')+'" onclick="clienteDetalleTab=\''+t[0]+'\';renderClienteDetalle(\''+id+'\')">'+t[1]+'</div>').join('')+'</div>';
  let body='';
  if(clienteDetalleTab==='resumen'){
    body='<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">'+
      '<div>'+infoRow('Contacto',c.contacto||'—')+infoRow('Teléfono',c.telefono||'—')+infoRow('Email',c.email||'—')+infoRow('Instagram',c.instagram||'—')+infoRow('Rubro',c.rubro||'—')+'</div>'+
      '<div>'+infoRow('Estado','<span class="badge '+ESTADO_CLIENTE_COLOR[c.estado]+'">'+ESTADOS_CLIENTE.find(e=>e.value===c.estado).label+'</span>')+
        infoRow('Abono mensual',c.abonoMensual>0?fMoney(c.abonoMensual,c.moneda):'—')+infoRow('Día de pago',c.fechaPago||'—')+
        infoRow('Modalidad de pago',c.modalidadPago||'—')+infoRow('Fecha de inicio',c.fechaInicio||'—')+'</div></div>'+
      (c.observaciones?'<div style="margin-top:14px"><div style="font-size:11px;text-transform:uppercase;color:var(--text3);margin-bottom:4px">Observaciones</div><p style="font-size:12.5px;color:var(--text2)">'+esc(c.observaciones)+'</p></div>':'');
  } else if(clienteDetalleTab==='presupuestos'){
    body = presupuestosCliente.length===0 ? emptyState('','Sin presupuestos para este cliente todavía.') :
      '<div class="table-wrap"><table><thead><tr><th>N°</th><th>Fecha</th><th>Estado</th></tr></thead><tbody>'+
      presupuestosCliente.map(p=>'<tr><td class="main">#'+p.numero+'</td><td>'+p.fecha+'</td><td>'+ESTADOS_PRESUPUESTO.find(e=>e.value===p.estado).label+'</td></tr>').join('')+'</tbody></table></div>';
  } else if(clienteDetalleTab==='pagos'){
    body = pagosCliente.length===0 ? emptyState('','Sin movimientos registrados para este cliente.') :
      '<div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Descripción</th><th>Estado</th><th>Monto</th></tr></thead><tbody>'+
      pagosCliente.map(m=>'<tr><td>'+m.fecha+'</td><td class="main">'+esc(m.descripcion)+'</td><td><span class="badge '+(m.estado==='cobrado'||m.estado==='pagado'?'green':'orange')+'">'+m.estado+'</span></td><td>'+fMoney(m.monto,m.moneda)+'</td></tr>').join('')+'</tbody></table></div>';
  } else if(clienteDetalleTab==='rentabilidad'){
    body = infoRow('Ingresos totales registrados',fMoney(rent.ingresos),'blue')+infoRow('Gastos atribuidos',fMoney(rent.gastos),'orange')+
      infoRow('Ganancia',fMoney(rent.ganancia),rent.ganancia>=0?'green':'red')+infoRow('Margen',fPct(rent.margen,1),rent.margen>=0?'green':'red')+
      '<p style="margin-top:12px;font-size:11px;color:var(--text3)">Calculado a partir de los movimientos de Finanzas vinculados a este cliente (histórico completo).</p>';
  }
  openModal(c.marca, tabsHtml+body, '', true);
}
function infoRow(label,value,color){
  return '<div style="display:flex;justify-content:space-between;border-bottom:1px solid rgba(227,219,203,.5);padding:7px 0"><div style="font-size:12px;color:var(--text3)">'+esc(label)+'</div><div style="font-size:12px;font-weight:500'+(color?';color:var(--'+color+')':'')+'">'+value+'</div></div>';
}
</script>

function serviciosPorMargen(){
  return DB.servicios.filter(s=>s.precioBase>0).map(s=>({servicio:s,margenPct:pctDe(s.precioBase-s.costoInterno,s.precioBase)})).sort((a,b)=>b.margenPct-a.margenPct);
}
function horasPorServicio(){
  const map=new Map();
  DB.presupuestos.forEach(p=>p.items.forEach(it=>{ const s=it.servicioId?DB.servicios.find(sv=>sv.id===it.servicioId):null; if(!s) return; map.set(s.id,(map.get(s.id)||0)+it.cantidad*s.horasEstimadas); }));
  return Array.from(map.entries()).map(([id,horas])=>({servicio:DB.servicios.find(s=>s.id===id),horas})).filter(x=>x.servicio).sort((a,b)=>b.horas-a.horas);
}
function renderReportes(){
  const mes=period.mes, anio=period.anio, r=resumenMes(mes,anio);
  const rentabilidad=rentabilidadPorCliente(mes,anio);

  const porMargen=serviciosPorMargen(), servicioMasRentable=porMargen[0];
  const porHoras=horasPorServicio();
  const ingresoPromedio = rentabilidad.length>0 ? rentabilidad.reduce((a,x)=>a+x.ingresos,0)/rentabilidad.length : 0;
  const now=new Date(); let gastoPromedio=0; for(let i=0;i<3;i++){ const d=new Date(now.getFullYear(),now.getMonth()-i,1); gastoPromedio+=gastosMes(d.getMonth()+1,d.getFullYear()); } gastoPromedio/=3;
  const pe=calcularPuntoEquilibrio();
  const objetivo = window._objetivoGanancia==null ? DB.config.sueldoObjetivoDirectora : window._objetivoGanancia;
  const facturacionObjetivo = pe.facturacionParaGanancia(Number(objetivo)||0);
  const alertas=calcularAlertas();
  const maxRent=Math.max(1,...rentabilidad.map(x=>Math.abs(x.ganancia)));
  const maxHoras=Math.max(1,...porHoras.map(h=>h.horas));

  $('page-reportes').innerHTML =
    '<div class="page-header"><div><h2 class="page-title">Reportes de rentabilidad</h2><p class="page-sub">'+MESES[mes-1]+' '+anio+'</p></div></div>'+

      kpi('Cliente más rentable',masRentable?esc(masRentable.cliente.marca):'—','green',masRentable?fMoney(masRentable.ganancia):'')+
      kpi('Cliente menos rentable',menosRentable?esc(menosRentable.cliente.marca):'—',menosRentable&&menosRentable.ganancia<0?'red':'orange',menosRentable?fMoney(menosRentable.ganancia):'')+
      kpi('Servicio más rentable',servicioMasRentable?esc(servicioMasRentable.servicio.nombre):'—','accent',servicioMasRentable?fPct(servicioMasRentable.margenPct):'')+
      kpi('Servicio que más horas consume',porHoras[0]?esc(porHoras[0].servicio.nombre):'—','',porHoras[0]?porHoras[0].horas.toFixed(0)+' hs':'')+
      kpi('Margen bruto',fPct(r.cobrado>0?(r.gananciaBruta/r.cobrado)*100:0,1))+
      kpi('Margen neto',fPct(r.margenGanancia,1),r.margenGanancia>=0?'green':'red')+
      kpi('Ingreso promedio por cliente',fMoney(ingresoPromedio))+
      kpi('Gasto promedio mensual',fMoney(gastoPromedio),'orange')+
    '</div>'+
    (alertas.length>0?'<div class="card"><div class="card-title">Alertas</div>'+alertas.map(a=>'<div class="alert '+a.kind+'">'+a.texto+'</div>').join('')+'</div>':'')+
    '<div class="card"><div class="card-title">Punto de equilibrio y proyección</div>'+
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px">'+
      kpi('Costos fijos mensuales (prom.)',fMoney(pe.costosFijosMensuales))+kpi('Facturación para cubrir costos',fMoney(pe.facturacionNecesariaCubrirCostos),'orange')+kpi('Facturación para la ganancia objetivo',fMoney(facturacionObjetivo),'accent')+
      '</div><div class="field" style="margin-top:12px;max-width:220px"><label>Ganancia objetivo mensual</label><input type="number" min="0" value="'+(objetivo||'')+'" oninput="window._objetivoGanancia=this.value;renderReportes()"></div>'+
      '<p style="margin-top:8px;font-size:11px;color:var(--text3)">Estimación basada en el promedio de gastos y sueldos de los últimos 3 meses, más los sueldos fijos actuales del equipo.</p></div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px" class="dash-grid">'+
      '<div class="card"><div class="card-title">Rentabilidad por cliente (mes)</div>'+(rentabilidad.length===0?emptyState('','Sin datos suficientes.'):rentabilidad.map(rr=>barRow(rr.cliente.marca,fMoney(rr.ganancia),(Math.abs(rr.ganancia)/maxRent)*100,rr.ganancia>=0?'green':'red')).join(''))+'</div>'+
      '<div class="card"><div class="card-title">Horas consumidas por servicio</div>'+(porHoras.length===0?emptyState('','Sin datos suficientes.'):porHoras.slice(0,8).map(h=>barRow(h.servicio.nombre,h.horas.toFixed(0)+' hs',(h.horas/maxHoras)*100,'blue')).join(''))+'</div>'+

      rentabilidad.map(rr=>'<tr><td class="main">'+esc(rr.cliente.marca)+'</td><td>'+fMoney(rr.ingresos)+'</td><td>'+fMoney(rr.gastos)+'</td><td style="color:'+(rr.ganancia>=0?'var(--green)':'var(--red)')+'">'+fMoney(rr.ganancia)+'</td><td>'+fPct(rr.margen,1)+'</td></tr>').join('')+
      '</tbody></table></div>')+'</div>';
}

    estado:'borrador',moneda:c.monedaPrincipal,tipoCambio:c.tipoCambioDefault,respuestas:emptyWizardRespuestas(),items:[],costosAdicionales:[],
    impuestosPct:c.porcentajeImpuestos,comisionesPct:c.comisionesPct,margenMinimoPct:c.margenGananciaMinimo,margenSugeridoPct:c.margenGananciaSugerido,
    margenPremiumPct:c.margenGananciaPremium,fondoImprevistosPct:c.fondoImprevistos,precioElegido:'sugerido',precioManual:0,distribucion:[],
    introduccion:'',objetivos:'',entregables:'',cronograma:'',formaPago:'',condiciones:'',serviciosNoIncluidos:'',observaciones:''};
}
function itemDeServicio(s,cantidad){ return {id:uid('item'),servicioId:s.id,nombre:s.nombre,cantidad,unidad:s.unidad,precioUnitario:s.precioBase,costoUnitario:s.costoInterno}; }
function sugerirItems(r){
  const out=[]; const buscar=n=>DB.servicios.find(s=>s.nombre===n);
  const add=(n,q)=>{ if(q<=0) return; const s=buscar(n); if(s) out.push(itemDeServicio(s,q)); };
  add('Estrategia de redes sociales', r.estrategiaComunicacion?1:0);
  add('Community management', r.communityManagement?1:0);
  add('Planificación mensual de contenido', r.modalidadTrabajo==='mensual'?1:0);
  add('Posts estáticos', r.publicacionesMensuales);
  add('Historias de Instagram', r.historiasMensuales);
  add('Reels', r.reels?r.reelsCantidad:0);
  add('Edición de reels', (r.reels&&r.edicion)?r.reelsCantidad:0);
  add('Fotografía de producto', (r.produccionPresencial&&r.fotografia)?r.jornadas:0);
  add('Filmación de contenido', (r.produccionPresencial&&r.video)?r.jornadas:0);
  add('Estilismo', (r.produccionPresencial&&r.estilismo)?r.jornadas:0);
  add('Dirección creativa', r.direccionCreativa?1:0);
  add('Diseño gráfico', r.disenoGrafico?Math.max(2,Math.round(r.publicacionesMensuales/2)):0);
  add('Cobertura de eventos', r.coberturaEventos?1:0);
  return out;
}
function sugerirCostos(r){
  const out=[]; const add=(cat,desc)=>out.push({id:uid('cad'),categoria:cat,descripcion:desc,monto:0});
  if(r.traslados) add('Traslados','Traslados del equipo');
  if(r.locacion) add('Alquiler de locación','Locación para producción');
  if(r.utileria) add('Utilería','Utilería para producción');
  if(r.modelos) add('Modelos','Casting / cachet de modelos');
  if(r.maquillaje) add('Maquillaje y peinado','Maquillaje y peinado');
  return out;
}

function iniciarNuevoPresupuesto(){ presDraft=nuevoDraft(); presStep=0; presView='wizard'; renderPresupuestos(); }
function elegirClienteExistente(id){
  const c=DB.clientes.find(x=>x.id===id);

}
function stepsHtml(){
  return '<div class="steps">'+WIZARD_STEPS.map((l,i)=>{

    '<span class="yesno"><button type="button" class="'+(val?'on':'')+'" onclick="presDraft.respuestas.'+field+'=true;renderWizard()">Sí</button><button type="button" class="'+(!val?'on':'')+'" onclick="presDraft.respuestas.'+field+'=false;renderWizard()">No</button></span></div>';

function wizardAtras(){ presStep=Math.max(0,presStep-1); renderWizard(); }
function wizardSiguiente(){
  if(presStep===1 && presDraft.items.length===0) presDraft.items=sugerirItems(presDraft.respuestas);
  if(presStep===2 && presDraft.costosAdicionales.length===0) presDraft.costosAdicionales=sugerirCostos(presDraft.respuestas);
  presStep=Math.min(WIZARD_STEPS.length-1,presStep+1); renderWizard();
}
function crearPresupuesto(){
  if(!presDraft.nombreCliente.trim()){ toast('Ingresá el nombre del cliente o marca.','error'); presStep=0; renderWizard(); return; }
  DB.presupuestos.push(presDraft); save(); toast('Presupuesto creado.');
  presDetalleId=presDraft.id; presTab='resumen'; presView='detail'; presDraft=null; renderPresupuestos();
}
function abrirDetallePresupuesto(id){ presDetalleId=id; presTab='resumen'; presView='detail'; renderPresupuestos(); }
function duplicarPresupuesto(id){
  const p=DB.presupuestos.find(x=>x.id===id); const copia=JSON.parse(JSON.stringify(p));
  copia.id=uid('pre'); copia.numero=siguienteNumeroPresupuesto(); copia.estado='borrador'; copia.fecha=todayISO();
  DB.presupuestos.push(copia); save(); toast('Presupuesto duplicado.'); renderPresupuestos();
}
function eliminarPresupuesto(id){
  DB.presupuestos=DB.presupuestos.filter(p=>p.id!==id); save(); toast('Presupuesto eliminado.','info');
  if(presDetalleId===id){ presView='list'; presDetalleId=null; }
  renderPresupuestos();
}

function distribucionEditorHtml(p){
  const t=calcularPresupuesto(p); const resumen=resumenDistribucion(p,t.precioFinal);
  let alertHtml='';
  if(resumen.excede) alertHtml='<div class="alert danger">La distribución supera el presupuesto total por '+fMoney(-resumen.diferencia,p.moneda)+'.</div>';
  else if(resumen.incompleto) alertHtml='<div class="alert warning">Quedan '+fMoney(resumen.diferencia,p.moneda)+' sin asignar.</div>';
  else if(p.distribucion.length>0) alertHtml='<div class="alert success">La distribución cubre el 100% del presupuesto.</div>';
  return alertHtml+'<div style="margin:12px 0"><button class="btn ghost sm" onclick="agregarDistribucion()">+ Agregar categoría</button></div>'+
    (p.distribucion.length===0?emptyState('','Sin distribución cargada todavía.'):
    '<div class="table-wrap"><table><thead><tr><th>Categoría</th><th>Persona</th><th>Tipo</th><th>Valor</th><th>Monto</th><th></th></tr></thead><tbody>'+

      '<td><input type="number" min="0" style="width:90px" value="'+d.valor+'" onchange="distUpdate('+i+',\'valor\',Number(this.value))"></td>'+

  let body='';
  if(presTab==='resumen') body=resultadoViewHtml(p);
  else if(presTab==='items') body=itemsEditorHtml(p);
  else if(presTab==='costos') body=costosEditorHtml(p);
  else if(presTab==='parametros') body=parametrosEditorHtml(p);
  else if(presTab==='distribucion') body=distribucionEditorHtml(p);
  else if(presTab==='documento') body=documentoEditorHtml(p);

function convertirEnCliente(id){
  const p=DB.presupuestos.find(x=>x.id===id); const t=calcularPresupuesto(p);
  if(p.clienteId){
    const c=DB.clientes.find(x=>x.id===p.clienteId); c.estado='activo';
    if(p.respuestas.modalidadTrabajo==='mensual') c.abonoMensual=t.precioFinal;
  } else {
    const nuevoId=uid('cli');
    DB.clientes.push({id:nuevoId,marca:p.nombreCliente,contacto:p.contacto,telefono:'',email:'',instagram:'',rubro:p.respuestas.tipoMarca||'',
      fechaInicio:todayISO(),estado:'activo',serviciosContratados:p.items.map(it=>it.servicioId).filter(Boolean),
      abonoMensual:p.respuestas.modalidadTrabajo==='mensual'?t.precioFinal:0,moneda:p.moneda,fechaPago:'',modalidadPago:'',

    p.clienteId=nuevoId;

  save(); toast('Cliente activo creado/actualizado a partir del presupuesto.'); renderPresupuestos();
}
